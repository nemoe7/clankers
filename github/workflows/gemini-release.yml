name: Gemini Release Draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string
      previous_tag:
        description: Optional published ancestor release tag
        required: false
        type: string
      model:
        description: Gemini model ID
        default: gemini-3.5-flash-lite
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gemini-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check Out Trusted Workflow Sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate Draft
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          GEMINI_MODEL: ${{ inputs.model }}
        run: python github/workflows/gemini_release.py
