name: Sync to clankers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-to-clankers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout clankers
        uses: actions/checkout@v4
        with:
          repository: nemoe7/clankers
          ref: main
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0

      - name: Add skills remote
        env:
          SKILLS_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          test -n "$SKILLS_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$SKILLS_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          git remote add skills https://github.com/nemoe7/skills.git
          git fetch skills main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync skills subtree
        id: sync
        continue-on-error: true
        run: |
          git subtree pull \
            --prefix=skills \
            skills main \
            --squash \
            -m "chore(skills): sync from SOT"

      - name: Open conflict PR
        if: steps.sync.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if ! git diff --name-only --diff-filter=U | grep -q .; then
            exit 1
          fi

          BRANCH="skills-sync-conflict-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(skills): sync conflict"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(skills): resolve sync conflict" \
            --body "Automated skills sync from nemoe7/skills encountered a merge conflict. Resolve the conflicts in this PR, then merge it."

      - name: Fail after conflict PR
        if: steps.sync.outcome == 'failure'
        run: exit 1

      - name: Push clankers
        run: |
          git push origin main
