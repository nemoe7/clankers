# Dedicated nuu configuration so nuu boards and reports use nuu's own house stylesheet
# rather than the repository's arena-skill preview styling.

stylesheet = "references/style.css"

[fonts]
sans = '"Inter", system-ui, -apple-system, "Segoe UI", sans-serif'
mono = '"Monaspace Neon", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace'
files = []
prefer_project_css = false

[annotate]
scale = 2
renderer = "auto"

[board]
stylesheet = "references/style.css"
columns = 2
scale = 2
wireframe = false

[audit]
widths = [1920, 1080, 958, 411, 855]
wireframe = false
