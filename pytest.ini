[pytest]
# One root `pytest` runs every Python test; `gate_*.py` files are gates, not tests.
# Every run splits across the workers, local and CI both, so the config is the single source.
addopts = -n auto
testpaths = skills/refs/arena-skill/scripts github/workflows maintenance
python_files = test_*.py
pythonpath = github/workflows maintenance maintenance/gpt_plugins maintenance/measurements maintenance/minify maintenance/pr maintenance/publish maintenance/workflows
