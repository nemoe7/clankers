name: Artifacts

on:
  push:
    branches: [main]
    paths:
      - 'gpt-plugins/**'
      - 'maintenance/gpt_plugins/**'
      - 'skills/nemoizer/**'
      - 'skills/refs/nemoizer/**'
      - 'rules/**'
      - '!rules/refs/**'
      - 'maintenance/publish/publish.py'
      - 'tests/maintenance/publish/test_publish.py'
      - 'skills/arena-skill/arena-egress-proxy/**'
      - 'skills/arena-skill/arena-preview-proxy/**'
      - '.github/workflows/artifacts.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'gpt-plugins/**'
      - 'maintenance/gpt_plugins/**'
      - 'skills/nemoizer/**'
      - 'skills/refs/nemoizer/**'
      - '.github/workflows/artifacts.yml'
  workflow_dispatch:
    inputs:
      egress_image:
        description: Publish the arena-egress-proxy image
        type: boolean
        default: false
      preview_image:
        description: Publish the arena-preview-proxy image
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # One trigger feeds several jobs with different path interests, so a small job decides which side has work.
  # Use the PR base for pull requests and the previous push for pushes. Manual runs package main and never publish the Gist. Publish an image only when its input asks.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.detect.outputs.package }}
      rules: ${{ steps.detect.outputs.rules }}
      egress: ${{ steps.detect.outputs.egress }}
      preview: ${{ steps.detect.outputs.preview }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Changed Path Groups
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EGRESS_IMAGE: ${{ github.event.inputs.egress_image }}
          PREVIEW_IMAGE: ${{ github.event.inputs.preview_image }}
        # The path rules live in one script, which three change steps call.
        run: python3 maintenance/workflows/changed_paths.py --step artifacts

  validate-gpt-plugins:
    name: Validate GPT Plugins
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Cancel older runs in this group at job level.
      group: Validate-GPT-Plugins-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch PR Base
        env:
          # The base ref reaches the shell through the environment, never through a
          # template expansion inside the run block.
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF"

      - name: Prep Runner
        uses: ./.github/actions/prepare
        with:
          pip-cache-key: artifacts-validate

      - name: Install Validation Dependencies
        run: uv pip install --system -r requirements.txt

      # The required behaviour of this file is part of the check: the triggers, the job
      # conditions, the version-bump flag, the archive name and the artifact name are assertions.
      - name: Check Workflow Contract
        run: python maintenance/workflows/check_artifacts.py

      - name: Check Version Comparison
        run: python maintenance/gpt_plugins/gate_gpt_plugins.py --self-check

      - name: Validate Plugin Collection
        env:
          # The base commit reaches the shell through the environment, never through a
          # template expansion inside the run block.
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE="$PR_BASE"
          git show "$BASE:gpt-plugins/plugin.json" > "$RUNNER_TEMP/base-plugin.json"
          changed="$(git diff --name-only "$BASE" HEAD -- gpt-plugins/plugin.json gpt-plugins/skills skills/nemoizer/SKILL.md skills/nemoizer/references skills/nemoizer/scripts)"
          if [ -n "$changed" ]; then
            python maintenance/gpt_plugins/gate_gpt_plugins.py --base-manifest "$RUNNER_TEMP/base-plugin.json" --package-dir "$RUNNER_TEMP/gpt-plugin-assets"
          else
            python maintenance/gpt_plugins/gate_gpt_plugins.py --package-dir "$RUNNER_TEMP/gpt-plugin-assets"
          fi

  package-gpt-plugins:
    name: Package GPT Plugins
    needs: changes
    if: needs.changes.outputs.package == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Cancel older runs in this group at job level.
      group: Package-GPT-Plugins-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Prep Runner
        uses: ./.github/actions/prepare
        with:
          pip-cache-key: artifacts-package

      - name: Install Validation Dependencies
        run: uv pip install --system -r requirements.txt

      - name: Check Workflow Contract
        run: python maintenance/workflows/check_artifacts.py

      - name: Build and Check Plugin Archives
        run: python maintenance/gpt_plugins/gate_gpt_plugins.py --package-dir .

      - name: Verify Archive
        run: |
          unzip -l gpt-plugins.zip
          python maintenance/gpt_plugins/gate_gpt_plugins.py --archive gpt-plugins.zip --archives-dir .

      - name: Upload Plugin Archive
        uses: actions/upload-artifact@v7
        with:
          path: gpt-plugins.zip
          archive: false

      - name: Upload gpt-quirks Archive
        uses: actions/upload-artifact@v7
        with:
          path: gpt-quirks.zip
          archive: false

      - name: Upload gpt-handoff Archive
        uses: actions/upload-artifact@v7
        with:
          path: gpt-handoff.zip
          archive: false

      - name: Upload gpt-planning Archive
        uses: actions/upload-artifact@v7
        with:
          path: gpt-planning.zip
          archive: false

      - name: Upload gpt-github Archive
        uses: actions/upload-artifact@v7
        with:
          path: gpt-github.zip
          archive: false

      - name: Upload gpt-display Archive
        uses: actions/upload-artifact@v7
        with:
          path: gpt-display.zip
          archive: false

      - name: Upload gpt-question Archive
        uses: actions/upload-artifact@v7
        with:
          path: gpt-question.zip
          archive: false

      - name: Upload nemoizer Archive
        uses: actions/upload-artifact@v7
        with:
          path: nemoizer.zip
          archive: false

  publish-clankers-rules:
    name: Publish Rules to Gist
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # A later main push supersedes an older pending run. Never interrupt a running reconciliation.
      group: publish-clankers-rules-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check Out Pushed Rules
        uses: actions/checkout@v7
      - name: Prep Runner
        uses: ./.github/actions/prepare
        with:
          pip-cache-key: artifacts-publish
      - name: Install Test Dependencies
        run: uv pip install --system pytest==9.1.1 pytest-xdist==3.6.1
      - name: Test Reconciliation Fixtures Without GitHub Credentials
        run: python3 -m pytest -q tests/maintenance/publish/test_publish.py
      - name: Reconcile Secret Clankers-Rules Gist
        # GIST_TOKEN needs Gists:write and repository Variables:write.
        # Checkout uses GITHUB_TOKEN only. It cannot manage repository variables.
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.GIST_ID }}
        run: python3 maintenance/publish/publish.py

  release-gpt-plugins:
    name: Release GPT Plugins
    needs: [changes, package-gpt-plugins]
    if: needs.changes.outputs.package == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Two main pushes serialize, so one release write never races another.
      group: Release-GPT-Plugins-${{ github.repository }}
      cancel-in-progress: false
    # The release writes a tag and an asset, so this job alone carries the scope. Its `if`
    # names a non-pull-request event, so no pull request code ever runs with it.
    permissions:
      contents: write
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          # The release step uses GH_TOKEN, so the checkout keeps no credentials.
          persist-credentials: false

      - name: Prep Runner
        uses: ./.github/actions/prepare
        with:
          pip-cache-key: artifacts-release

      - name: Install Validation Dependencies
        run: uv pip install --system -r requirements.txt

      - name: Read Manifest Version
        id: manifest
        run: |
          set -eu
          version="$(python -c "import json; print(json.load(open('gpt-plugins/plugin.json'))['version'])")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Download Validated Archive
        uses: actions/download-artifact@v8
        with:
          pattern: '*.zip'
          merge-multiple: true
          skip-decompress: true

      - name: Verify Archive
        run: |
          unzip -l gpt-plugins.zip
          python maintenance/gpt_plugins/gate_gpt_plugins.py --archive gpt-plugins.zip --archives-dir .

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -eu
          tag="gpt-plugins-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" gpt-*.zip nemoizer.zip --clobber
          else
            gh release create "$tag" gpt-*.zip nemoizer.zip \
              --title "GPT Plugins $VERSION" \
              --target "$GITHUB_SHA" \
              --notes "The GPT Plugins collection and seven single-skill plugins at version $VERSION. Archive checks do not prove ChatGPT import support."
          fi

  publish-proxy-images:
    name: Publish Proxy Image (${{ matrix.directory }})
    needs: changes
    if: |
      github.event_name != 'pull_request'
      && (needs.changes.outputs.egress == 'true' || needs.changes.outputs.preview == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      # Two main pushes serialize, so one image write never races another.
      group: Publish-Proxy-Images-${{ github.repository }}
      cancel-in-progress: false
    # A package write publishes the image. Every other scope stays read-only. Its `if`
    # names a non-pull-request event, so no pull request code ever runs with it.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # One row per proxy image, and the row's own flag decides whether it builds.
        include:
          - directory: arena-egress-proxy
            changed: ${{ needs.changes.outputs.egress }}
          - directory: arena-preview-proxy
            changed: ${{ needs.changes.outputs.preview }}
    steps:
      - name: Check Out Repository
        if: matrix.changed == 'true'
        uses: actions/checkout@v7
        with:
          # The push uses the token from the login step, not a stored credential.
          persist-credentials: false

      - name: Set Up QEMU
        if: matrix.changed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set Up Buildx
        if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: matrix.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Proxy Image
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: skills/arena-skill/${{ matrix.directory }}
          file: skills/arena-skill/${{ matrix.directory }}/Dockerfile
          push: true
          # An arm64 host pulls the right layer instead of emulating amd64.
          platforms: linux/amd64,linux/arm64
          # One mutable tag. The owner pulls latest and manages no versions.
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.directory }}:latest
