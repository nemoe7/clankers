# Pushes rules/ARENA.md to each listed repo's $DEST and mirrors $SKILL_SRC into
# each target's $SKILL_DEST minus $SKILL_EXCLUDE, then verifies every target's
# committed copies match the source byte for byte. $SKILL_EXCLUDE holds
# BASELINE.md, this repository's unsquashed reference original, which a target
# has no use for. The destination is cleared before the mirror, so an excluded
# file an earlier run delivered is deleted on the next dispatch instead of
# surviving in every target, and the file-list check below verifies the deletion.
# Needs a short-expiry fine-grained PAT (Contents read/write on every
# target repo) stored as the ARENA_DIST_PAT secret.
# Dispatch only: a repository not in REPOS (or the repos input) never receives
# ARENA.md or the skill, so add new targets to REPOS. Delivery is not activation;
# see rules/README.md#arena-file for the bootstrap line a session needs, and a
# delivered skill still needs its steering channel started per session.
name: distribute-arena
on:
  workflow_dispatch:
    inputs:
      repos:
        description: Space-separated owner/repo list; overrides REPOS
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: distribute-arena
  cancel-in-progress: false
env:
  REPOS: "nemoe7/clankers nemoe7/daedalus nemoe7/asset-tracker nemoe7/wiki"
  DEST: ARENA.md
  SKILL_SRC: skills/arena-live-steering
  SKILL_DEST: .agents/skills/arena-live-steering
  SKILL_EXCLUDE: BASELINE.md
jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
      - name: Sync ARENA.md and the steering skill to target repos
        env:
          ARENA_DIST_PAT: ${{ secrets.ARENA_DIST_PAT }}
        run: |
          set -e
          list="${{ inputs.repos }}"
          [ -n "$list" ] || list="$REPOS"
          [ -n "$list" ] || { echo "::error::no target repos: set REPOS or pass the repos input"; exit 1; }
          src="$GITHUB_WORKSPACE/rules/ARENA.md"
          skill_src="$GITHUB_WORKSPACE/$SKILL_SRC"
          [ -f "$src" ] || { echo "::error::rules/ARENA.md missing from the checkout"; exit 1; }
          [ -d "$skill_src" ] || { echo "::error::$SKILL_SRC missing from the checkout"; exit 1; }
          # Distribute what is tracked rather than whatever is on disk, so a local
          # build artifact can never ride along into four repositories.
          files=$(git -C "$GITHUB_WORKSPACE" ls-files "$SKILL_SRC" | sed "s|^$SKILL_SRC/||" | grep -vxF "$SKILL_EXCLUDE")
          [ -n "$files" ] || { echo "::error::no tracked files under $SKILL_SRC"; exit 1; }
          failed=""
          git config --global credential.helper '!f() { echo username=x-access-token; echo "password=$ARENA_DIST_PAT"; }; f'
          # shellcheck disable=SC2086 -- intentional word splitting of the repo list
          for repo in $list; do
            (
              set -e
              work=$(mktemp -d)
              trap 'rm -rf "$work"' EXIT
              git clone "https://github.com/$repo.git" "$work"
              mkdir -p "$work/$(dirname "$DEST")"
              cp "$src" "$work/$DEST"
              # Mirror the skill exactly: clear the destination first, so a file
              # deleted upstream cannot survive in the target.
              rm -rf "$work/$SKILL_DEST"
              for f in $files; do
                mkdir -p "$work/$SKILL_DEST/$(dirname "$f")"
                cp "$skill_src/$f" "$work/$SKILL_DEST/$f"
              done
              cd "$work"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "$DEST" "$SKILL_DEST"
              msg="chore(arena): sync ARENA.md and arena-live-steering from nemoe7/clankers"
              git diff --cached --quiet || {
                git commit -m "$msg"
                git push -u origin HEAD
              }
              git show "HEAD:$DEST" | cmp -s - "$src" || {
                echo "::error::$repo: HEAD:$DEST does not match rules/ARENA.md after sync"
                exit 1
              }
              have=$(git ls-tree -r --name-only "HEAD:$SKILL_DEST" | sort)
              want=$(printf '%s\n' $files | sort)
              [ "$have" = "$want" ] || {
                echo "::error::$repo: $SKILL_DEST holds a different file list than $SKILL_SRC"
                exit 1
              }
              for f in $files; do
                git show "HEAD:$SKILL_DEST/$f" | cmp -s - "$skill_src/$f" || {
                  echo "::error::$repo: HEAD:$SKILL_DEST/$f does not match $SKILL_SRC/$f after sync"
                  exit 1
                }
              done
              echo "$repo: ARENA.md and $(printf '%s\n' $files | wc -l) skill file(s) verified"
            ) || failed="$failed $repo"
          done
          [ -z "$failed" ] || { echo "::error::sync failed for:$failed"; exit 1; }
