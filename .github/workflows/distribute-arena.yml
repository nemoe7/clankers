# Dispatch-only distribution of ARENA.md and the preview skill.
# Live skills only; retired installed transport files are removed on dispatch.
# ARENA_DIST_PAT needs short-lived Contents read/write access to every target.
# Delivery is not activation: each session must start its own preview.
name: distribute-arena
on:
  workflow_dispatch:
    inputs:
      repos:
        description: Space-separated owner/repo list; overrides REPOS
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: distribute-arena
  cancel-in-progress: false
env:
  REPOS: "nemoe7/clankers nemoe7/daedalus nemoe7/asset-tracker nemoe7/wiki"
  DEST: ARENA.md
  SKILLS: "arena-preview-steering"
  SKILL_ROOT: skills
  SKILL_DEST_ROOT: .agents/skills
  LEGACY_SKILLS: "arena-live-steering arena-preview-reporting"
jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
      - name: Sync ARENA.md and the preview skill to target repos
        env:
          ARENA_DIST_PAT: ${{ secrets.ARENA_DIST_PAT }}
          TARGET_REPOS: ${{ inputs.repos }}
        run: |
          set -e
          list="${TARGET_REPOS:-$REPOS}"
          [ -n "$list" ] || { echo "::error::no target repos configured"; exit 1; }
          src="$GITHUB_WORKSPACE/rules/ARENA.md"
          [ -f "$src" ] || { echo "::error::rules/ARENA.md missing"; exit 1; }
          for skill in $SKILLS; do
            [ -f "$GITHUB_WORKSPACE/$SKILL_ROOT/$skill/SKILL.md" ] || {
              echo "::error::$skill missing"; exit 1;
            }
          done
          failed=""
          git config --global credential.helper '!f() { echo username=x-access-token; echo "password=$ARENA_DIST_PAT"; }; f'
          for repo in $list; do
            (
              set -e
              work=$(mktemp -d)
              trap 'rm -rf "$work"' EXIT
              git clone "https://github.com/$repo.git" "$work"
              mkdir -p "$work/$(dirname "$DEST")"
              cp "$src" "$work/$DEST"
              for legacy in $LEGACY_SKILLS; do
                rm -rf "$work/$SKILL_DEST_ROOT/$legacy"
              done
              for skill in $SKILLS; do
                skill_src="$SKILL_ROOT/$skill"
                skill_dest="$SKILL_DEST_ROOT/$skill"
                files=$(git -C "$GITHUB_WORKSPACE" ls-files "$skill_src" | sed "s|^$skill_src/||" | grep -vFx README.md)
                [ -n "$files" ] || { echo "::error::no tracked files for $skill"; exit 1; }
                rm -rf "$work/$skill_dest"
                for f in $files; do
                  mkdir -p "$work/$skill_dest/$(dirname "$f")"
                  cp "$GITHUB_WORKSPACE/$skill_src/$f" "$work/$skill_dest/$f"
                done
              done
              cd "$work"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "$DEST"
              for skill in $SKILLS; do
                git add "$SKILL_DEST_ROOT/$skill"
              done
              for legacy in $LEGACY_SKILLS; do
                if [ -n "$(git ls-files "$SKILL_DEST_ROOT/$legacy")" ]; then
                  git add -u -- "$SKILL_DEST_ROOT/$legacy"
                fi
              done
              git diff --cached --quiet || {
                git commit -m "chore(arena): sync rules and preview skills from nemoe7/clankers"
                git push -u origin HEAD
              }
              git show "HEAD:$DEST" | cmp -s - "$src" || {
                echo "::error::$repo: ARENA.md differs after sync"; exit 1;
              }
              for legacy in $LEGACY_SKILLS; do
                [ -z "$(git ls-tree -r --name-only HEAD -- "$SKILL_DEST_ROOT/$legacy")" ] || {
                  echo "::error::$repo: retired skill $legacy remains"; exit 1;
                }
              done
              for skill in $SKILLS; do
                skill_src="$SKILL_ROOT/$skill"
                skill_dest="$SKILL_DEST_ROOT/$skill"
                files=$(git -C "$GITHUB_WORKSPACE" ls-files "$skill_src" | sed "s|^$skill_src/||" | grep -vFx README.md)
                have=$(git ls-tree -r --name-only "HEAD:$skill_dest" | sort)
                want=$(printf '%s\n' $files | sort)
                [ "$have" = "$want" ] || { echo "::error::$repo: $skill file-list mismatch"; exit 1; }
                for f in $files; do
                  git show "HEAD:$skill_dest/$f" | cmp -s - "$GITHUB_WORKSPACE/$skill_src/$f" || {
                    echo "::error::$repo: $skill/$f differs"; exit 1;
                  }
                done
              done
              echo "$repo: rules and the preview skill verified"
            ) || failed="$failed $repo"
          done
          [ -z "$failed" ] || { echo "::error::sync failed for:$failed"; exit 1; }
