name: PR Contract

on:
  pull_request:
    branches: ['**']
    # The body and the title change without a new commit, so both events matter.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: PR-Check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Check Commits and PR Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check Out Every Commit
        uses: actions/checkout@v7
        with:
          # The range check reads each commit of the pull request.
          fetch-depth: 0

      - name: Prep Runner
        uses: ./.github/actions/prepare
        with:
          pip-cache-key: pr-check

      - name: Install Validation Dependencies
        run: uv pip install --system -r requirements.txt

      - name: Check Commits, PR Title, and PR Body
        env:
          # The values reach the script through the environment, never through the script text.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: |
          set -eu
          printf '%s\n' "$PR_BODY" > "$PR_BODY_FILE"
          python maintenance/pr/gate_pr.py \
            --range "$PR_BASE..$PR_HEAD" \
            --pr-title "$PR_TITLE" \
            --body-file "$PR_BODY_FILE"
