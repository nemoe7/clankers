name: Publish Arena Proxy Image

on:
  push:
    branches: [main]
    paths:
      - 'skills/arena-skill/proxy/**'
      - '.github/workflows/publish-arena-proxy-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Two main pushes serialize, so one image write never races another.
  group: Publish-Arena-Proxy-Image-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish-arena-proxy-image:
    name: Publish Arena Proxy Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A package write publishes the image; every other scope stays read-only.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          # The push uses the token from the login step, not a stored credential.
          persist-credentials: false

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In To GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build And Push
        uses: docker/build-push-action@v6
        with:
          context: skills/arena-skill/proxy
          file: skills/arena-skill/proxy/Dockerfile
          push: true
          # An arm64 host pulls the right layer instead of emulating amd64.
          platforms: linux/amd64,linux/arm64
          # One mutable tag. The owner pulls latest and manages no versions.
          tags: ghcr.io/${{ github.repository_owner }}/arena-proxy:latest
