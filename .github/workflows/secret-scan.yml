name: Secret Scan

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]
  schedule:
    # A weekly full-history scan catches a leak in a commit range that no push trigger covers.
    - cron: '8 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: Secret-Scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # A finding on a pull request needs a review comment.
      pull-requests: write
    steps:
      - name: Check Out Repository With Full History
        uses: actions/checkout@v7
        with:
          # Full history lets the scheduled and the manual run scan every commit.
          fetch-depth: 0

      - name: Scan For Secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action runs gitleaks with --redact, so no log line and no uploaded
          # SARIF file holds a secret value.
