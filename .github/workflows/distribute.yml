# Distribute ARENA.md, the skills and the Gemini release workflow. Each job owns one target list, so the run page
# names every list on its own row. CLANKERS_DIST_PAT needs Contents write on each target and Workflows write on the Gemini ones.
name: Distribute
on:
  push:
    branches: [main]
    paths:
      - "rules/ARENA.md"
      - "skills/arena-skill/**"
      - "skills/nemo-ui/**"
      - "github/workflows/gemini-release.yml"
      - "github/workflows/gemini_release.py"
      - ".github/actions/distribute-sync/**"
      - ".github/workflows/distribute.yml"
  schedule:
    # Daily reconciliation: 03:17 UTC stays away from the top of the hour, when scheduled runs queue behind peak load.
    # The schedule repairs missed, failed and partial synchronization in every target group.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      repos:
        description: Space-separated owner/repo list for the Arena list
        required: false
        default: ""
      gemini_repos:
        description: Space-separated owner/repo list for the Gemini list
        required: false
        default: ""
      nemo_ui_repos:
        description: Space-separated owner/repo list for the nemo-ui list
        required: false
        default: ""
permissions:
  contents: read
jobs:
  arena:
    name: Distribute Arena
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: Distribute-Arena-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check Out Source Repository
        uses: actions/checkout@v7
      - name: Sync The Rules And The Arena Skills
        uses: ./.github/actions/distribute-sync
        env:
          CLANKERS_DIST_PAT: ${{ secrets.CLANKERS_DIST_PAT }}
        with:
          repos: ${{ inputs.repos }}
          repos-fallback: nemoe7/clankers nemoe7/daedalus nemoe7/asset-tracker nemoe7/wiki nemoe7/f360 nemoe7/request-tracker nemoe7/arena-cleanup
          rule-src: rules/ARENA.md
          rule-dest: ARENA.md
          skills: arena-skill
          legacy: arena-live-steering arena-preview-reporting arena-preview-steering arena-proxy arena
  gemini:
    name: Distribute Gemini
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: Distribute-Gemini-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check Out Source Repository
        uses: actions/checkout@v7
      - name: Sync The Gemini Release Workflow
        uses: ./.github/actions/distribute-sync
        env:
          CLANKERS_DIST_PAT: ${{ secrets.CLANKERS_DIST_PAT }}
        with:
          repos: ${{ inputs.gemini_repos }}
          repos-fallback: nemoe7/daedalus nemoe7/request-tracker
          files: gemini-release.yml gemini_release.py
  nemo-ui:
    name: Distribute nemo-ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: Distribute-nemo-ui-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check Out Source Repository
        uses: actions/checkout@v7
      # The job copies the skill from this repository and fails when the directory is gone.
      - name: Sync The nemo-ui Skill
        uses: ./.github/actions/distribute-sync
        env:
          CLANKERS_DIST_PAT: ${{ secrets.CLANKERS_DIST_PAT }}
        with:
          repos: ${{ inputs.nemo_ui_repos }}
          repos-fallback: nemoe7/request-tracker nemoe7/daedalus nemoe7/clankers nemoe7/arena-cleanup
          skills: nemo-ui
