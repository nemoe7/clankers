# Keep domain rows visible. One push job applies each target's matching domains in one checkout.
# CLANKERS_DIST_PAT needs Contents write on each target and Workflows write on the Gemini ones.
name: Distribution
on:
  push:
    branches: [main]
    paths:
      - "rules/ARENA.md"
      - "skills/arena-skill/**"
      - "skills/nuu/**"
      - "skills/nemoizer/**"
      - "github/workflows/gemini-release.yml"
      - "github/workflows/gemini_release.py"
      - ".github/actions/distribute-sync/**"
      - ".github/workflows/distribute.yml"
  schedule:
    # Daily reconciliation: 03:17 UTC stays away from the top of the hour, when scheduled runs queue behind peak load.
    # The schedule repairs missed, failed and partial synchronization in every target group.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      repos:
        description: Space-separated owner/repo list for the Arena list
        required: false
        default: ""
      gemini_repos:
        description: Space-separated owner/repo list for the Gemini list
        required: false
        default: ""
      nemo_ui_ux_repos:
        description: Space-separated owner/repo list for the Nemo UI/UX list
        required: false
        default: ""
      nemoizer_repos:
        description: Space-separated owner/repo list for the nemoizer list
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: Distribute-${{ github.repository }}
  cancel-in-progress: false
jobs:
  plan:
    name: Plan Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - name: Check Out Source Repository
        uses: actions/checkout@v7
      - name: Group Domain Targets
        id: plan
        env:
          ARENA_REPOS: ${{ inputs.repos }}
          GEMINI_REPOS: ${{ inputs.gemini_repos }}
          NEMO_UI_UX_REPOS: ${{ inputs.nemo_ui_ux_repos }}
          NEMOIZER_REPOS: ${{ inputs.nemoizer_repos }}
        run: python3 .github/actions/distribute-sync/plan.py
  domains:
    name: Validate ${{ matrix.domain }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check Out Source Repository
        uses: actions/checkout@v7
      - name: Check Domain Payload
        uses: ./.github/actions/distribute-sync
        with:
          validate-only: true
          repos: ${{ matrix.repos }}
          repos-fallback: ${{ matrix.repos }}
          rule-src: ${{ matrix.rule_src }}
          rule-dest: ${{ matrix.rule_dest }}
          skills: ${{ matrix.skills }}
          legacy: ${{ matrix.legacy }}
          files: ${{ matrix.files }}
  push:
    name: Push and Verify Targets
    needs: [plan, domains]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Out Source Repository
        uses: actions/checkout@v7
      - name: Push Each Target Once
        env:
          CLANKERS_DIST_PAT: ${{ secrets.CLANKERS_DIST_PAT }}
          TARGETS_JSON: ${{ needs.plan.outputs.targets }}
        run: python3 .github/actions/distribute-sync/plan.py --push
