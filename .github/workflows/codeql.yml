name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - '.agents/**'
  pull_request:
    branches: ['**']
  schedule:
    # A weekly scan keeps the analysis current when no pull request changes the code.
    - cron: '42 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: CodeQL-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The analysis reads the repository and uploads one SARIF file.
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Only the languages this repository holds: Python tooling, JavaScript
        # userscripts, and the workflow YAML itself.
        include:
          - language: python
          - language: javascript
          - language: actions
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Analysis
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            # Use the base copy, not code supplied by a pull request.
            if git show "$PR_BASE_SHA:maintenance/workflows/codeql_filter.py" > "$RUNNER_TEMP/codeql_filter.py"; then
              python3 "$RUNNER_TEMP/codeql_filter.py"
            else
              echo 'run=true' >> "$GITHUB_OUTPUT"
            fi
          else
            python3 maintenance/workflows/codeql_filter.py
          fi

      - name: Initialize CodeQL
        if: steps.select.outputs.run == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # These languages need no build.
          # CodeQL interprets or declares each one.
          build-mode: none
          # The shared config excludes py/full-ssrf and js/request-forgery, the two
          # proxy fetches that carry a guarded, caller-supplied URL by design.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        if: steps.select.outputs.run == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
