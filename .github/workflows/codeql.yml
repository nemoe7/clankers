name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  schedule:
    # A weekly scan keeps the analysis current when no pull request changes the code.
    - cron: '42 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: CodeQL-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The analysis reads the repository and uploads one SARIF file.
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Only the languages this repository holds: Python tooling, JavaScript
        # userscripts, and the workflow YAML itself.
        include:
          - language: python
          - language: javascript
          - language: actions
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Every language here is interpreted or declarative, so no build is needed.
          build-mode: none
          # The shared config excludes py/full-ssrf and js/request-forgery, the two
          # proxy fetches that carry a guarded, caller-supplied URL by design.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
