name: Release GPT Plugins

on:
  push:
    branches: [main]
    paths:
      - 'gpt-plugins/**'
      - '.github/workflows/release-gpt-plugins.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Two main pushes serialize, so one release write never races another.
  group: Release-GPT-Plugins-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-gpt-plugins:
    name: Release GPT Plugins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The release writes a tag and an asset, so this job alone carries the scope.
    permissions:
      contents: write
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          # The release step uses GH_TOKEN, so the checkout keeps no credentials.
          persist-credentials: false

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          # Keep the archive validation on the interpreter the other workflows use.
          python-version: "3.11"

      - name: Install Validation Dependencies
        run: python -m pip install jsonschema PyYAML markdown-it-py

      - name: Read The Manifest Version
        id: manifest
        run: |
          set -eu
          version="$(python -c "import json; print(json.load(open('gpt-plugins/plugin.json'))['version'])")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Package The Collection
        run: zip -r gpt-plugins.zip gpt-plugins/plugin.json gpt-plugins/skills

      - name: Verify The Archive
        run: |
          unzip -l gpt-plugins.zip
          python maintenance/check_gpt_plugins.py --archive gpt-plugins.zip

      - name: Publish The Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -eu
          tag="gpt-plugins-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" gpt-plugins.zip --clobber
          else
            gh release create "$tag" gpt-plugins.zip \
              --title "GPT Plugins $VERSION" \
              --target "$GITHUB_SHA" \
              --notes "The GPT Plugins collection at version $VERSION, packaged from gpt-plugins/plugin.json."
          fi
