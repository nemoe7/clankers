name: Workflow Security

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
      - 'maintenance/check_workflows.py'
  pull_request:
    branches: ['**']
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
      - 'maintenance/check_workflows.py'
  schedule:
    # A weekly run also lints a workflow that nobody touched.
    - cron: '26 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: Workflow-Security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint And zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Install actionlint
        env:
          # The release tarball carries the pinned tool; the workflow needs no Go toolchain.
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -eu
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL -o /tmp/actionlint.tar.gz "${base}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Lint The Workflows
        run: actionlint -color .github/workflows/*.yml

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install zizmor
        run: python -m pip install "zizmor==1.30.1"

      - name: Audit The Workflows
        # Medium and above fail the run; the pinned policy accepts major-version action tags.
        run: zizmor --config .github/zizmor.yml --min-severity=medium --format github .github/workflows

  audit:
    name: Workflow Set Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install The Parser
        run: python -m pip install "pyyaml==6.0.3"

      - name: Check The Workflow Set
        run: python maintenance/check_workflows.py
