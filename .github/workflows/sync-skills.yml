name: Sync skills

on:
  push:
    branches:
      - main
    paths:
      - "skills/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout clankers
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add skills remote
        env:
          SKILLS_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          test -n "$SKILLS_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$SKILLS_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          git remote add skills https://github.com/nemoe7/skills.git
          git fetch skills main

      - name: Push skills subtree
        run: |
          SKILLS_SHA="$(git subtree split --prefix=skills)"
          git push skills "${SKILLS_SHA}:main"
