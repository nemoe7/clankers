name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
    paths-ignore:
      - '.github/workflows/distribute.yml'
      - '.gitignore'
      - 'apply.bat'
      - 'automations/**'
      - 'CHANGELOG.md'
      - 'maintenance/README.md'

permissions:
  contents: read

# The suite spawns preview.py directly, so the self-install stays out of the tests.
env:
  ARENA_PREVIEW_NO_BOOTSTRAP: "1"

concurrency:
  group: CI-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Prepare The Runner
        uses: ./.github/actions/prepare
        with:
          pip-cache-key: ci

      - name: Install Maintenance Dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Build Dependencies And Check Generated Copies
        run: |
          npm ci
          python maintenance/minify/minify.py

      - name: Update And Validate Repository
        run: python maintenance/check.py --update

      - name: Lint And Format-Check Python
        run: |
          ruff check .
          ruff format --diff .

      - name: Check Budget Generator And Shipped Script Syntax
        run: |
          python maintenance/measurements/gate_measurements.py
          node --check skills/arena-skill/assets/app.js

      # The covered list lives in maintenance/check.py (STE_DOCS), shared with the local gate.
      - name: Lint The Covered Documentation
        run: python maintenance/check.py --ste

      - name: Check The Rules Gist Publisher
        run: python3 maintenance/publish/gate_publish.py

      - name: Check The Workflow Set
        run: python maintenance/workflows/gate_workflows.py

      - name: Check Userscript Bundles
        run: |
          node userscripts/arena.user.js
          node userscripts/chatgpt.user.js

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24

  version-bumps:
    name: Version Bumps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Versioned Module Changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base="$PUSH_BEFORE"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "base=missing" >> "$GITHUB_OUTPUT"
            echo "Base commit is missing. Will validate versions without bump check."
            echo "Versioned modules checked:"
            echo "- userscripts/arena.user.js"
            echo "- userscripts/chatgpt.user.js"
            exit 0
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          files=$(git diff --name-only "$base" HEAD -- userscripts/arena.user.js userscripts/chatgpt.user.js gpt-plugins/plugin.json gpt-plugins/skills || true)
          if [ -n "$files" ]; then
            printf '%s\n' "Affected files:" "$files"
            {
              echo "changed<<EOF"
              printf '%s\n' "$files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "No versioned modules changed."
            echo "changed=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Validation Dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Versioned Modules
        run: |
          python maintenance/userscripts/gate_userscripts.py --self-check
          python maintenance/userscripts/gate_userscripts.py
          python maintenance/gpt_plugins/gate_gpt_plugins.py --self-check

      - name: Enforce Version Bumps For Changed Modules
        env:
          BASE: ${{ steps.changes.outputs.base }}
          CHANGED: ${{ steps.changes.outputs.changed }}
        run: |
          set -eu
          if [ "$BASE" = "missing" ] || [ -z "$BASE" ]; then
            echo "Base missing, skipping bump enforcement."
            exit 0
          fi
          if [ -z "$CHANGED" ]; then
            echo "No versioned modules changed, skipping bump enforcement."
            exit 0
          fi
          echo "Version bump check for affected files:"
          printf '%s\n' "$CHANGED"
          printf '%s\n' "$CHANGED" | while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              userscripts/arena.user.js|userscripts/chatgpt.user.js)
                echo "--- Checking $file ---"
                git show "$BASE:$file" > "$RUNNER_TEMP/base-$(basename "$file")" || {
                  echo "$file did not exist in base, skipping bump check."
                  continue
                }
                python maintenance/userscripts/gate_userscripts.py --file "$file" --base-file "$RUNNER_TEMP/base-$(basename "$file")"
                ;;
              gpt-plugins/*)
                echo "--- Checking gpt-plugins/plugin.json for change in $file ---"
                git show "$BASE:gpt-plugins/plugin.json" > "$RUNNER_TEMP/base-plugin.json" || {
                  echo "gpt-plugins/plugin.json did not exist in base, skipping bump check."
                  continue
                }
                python maintenance/gpt_plugins/gate_gpt_plugins.py --base-manifest "$RUNNER_TEMP/base-plugin.json"
                ;;
            esac
          done

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Prepare The Runner
        uses: ./.github/actions/prepare
        with:
          pip-cache-key: tests

      - name: Install Test Dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Python Test Suite
        run: python -m pytest -q

      - name: Test Commit Message Hook
        run: python maintenance/pr/test_commit_msg.py

      - name: Run Node Userscript Tests
        run: node --test maintenance/workflows/userscripts.checks.cjs maintenance/workflows/userscripts.test.cjs

  preview-tests:
    name: Preview Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Preview Changes
        id: preview
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base="$PUSH_BEFORE"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Base commit is missing. Run the preview tests."
            exit 0
          fi
          files=$(git diff --name-only "$base" HEAD -- \
            skills/refs/arena-skill \
            skills/arena-skill \
            .agents/skills/arena-skill \
            maintenance/minify/minify.py \
            maintenance/minify/gate_minify.py \
            github/workflows \
            pytest.ini \
            package.json \
            package-lock.json \
            .github/workflows/ci.yml)
          if [ -n "$files" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "Preview paths changed:" "$files"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No preview paths changed. Skip the preview tests."
          fi

      - name: Prepare The Runner
        if: steps.preview.outputs.run == 'true'
        uses: ./.github/actions/prepare
        with:
          pip-cache-key: preview

      - name: Install Preview Dependencies
        if: steps.preview.outputs.run == 'true'
        run: |
          python -m pip install -r requirements.txt
          npm ci

      - name: Run Preview Checks
        if: steps.preview.outputs.run == 'true'
        run: |
          python maintenance/minify/gate_minify.py
          node --test --test-reporter=dot --test-concurrency=4 skills/refs/arena-skill/scripts/client.test.cjs
