name: Repo Checks

on:
  push:
    branches: [main]
    paths-ignore:
      - '.agents/**'
  pull_request:
    branches: ['**']
    paths-ignore:
      - '.github/workflows/distribute.yml'
      - '.gitignore'
      - 'apply.bat'
      - 'automations/**'
      - 'docs/CHANGELOG.md'
      - 'docs/**/CHANGELOG.md'
      - 'maintenance/README.md'

permissions:
  contents: read

# The suite spawns preview.py directly, so the self-install stays out of the tests.
env:
  ARENA_PREVIEW_NO_BOOTSTRAP: "1"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Prep Runner
        uses: ./.github/actions/prepare
        with:
          pip-cache-key: ci

      - name: Install Maintenance Dependencies
        run: uv pip install --system -r requirements.txt

      - name: Install Build Dependencies and Check Generated Copies
        run: |
          npm ci
          python maintenance/minify/minify.py

      - name: Update and Validate Repository
        run: python maintenance/check.py --update

      - name: Lint and Format-Check Python
        run: |
          ruff check .
          ruff format --diff .

      - name: Check Shipped Script Syntax
        run: |
          node --check skills/arena-skill/assets/app.js

      # The covered list lives in maintenance/check.py (STE_DOCS), shared with the local gate.
      - name: Lint Covered Docs
        run: python maintenance/check.py --ste

      - name: Check Workflow Set
        run: python maintenance/workflows/gate_workflows.py

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24

  version-bumps:
    name: Check Module Versions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prep Runner
        uses: ./.github/actions/prepare
        with:
          pip-cache-key: version-bumps

      - name: Install Validation Dependencies
        run: uv pip install --system -r requirements.txt

      - name: Check Versioned Modules
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BEFORE"
          fi
          python maintenance/pr/gate_pr.py --version-bumps "$BASE..$HEAD_SHA"

  test-changes:
    name: Select Module Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.modules.outputs.run }}
      matrix: ${{ steps.modules.outputs.matrix }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Affected Modules
        id: modules
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: python3 maintenance/workflows/changed_paths.py --step module-tests

  module-tests:
    name: ${{ matrix.name }} Tests
    needs: test-changes
    if: needs.test-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-changes.outputs.matrix) }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Prep Runner
        uses: ./.github/actions/prepare
        with:
          pip-cache-key: tests-${{ matrix.name }}

      - name: Install Test Dependencies
        run: |
          uv pip install --system -r requirements.txt
          npm ci

      - name: Run Module Tests
        env:
          MODULE_TEST_COMMAND: ${{ matrix.command }}
        run: bash -euo pipefail -c "$MODULE_TEST_COMMAND"
