name: Repo Checks

on:
  push:
    branches: [main]
    paths-ignore:
      - '.agents/**'
  pull_request:
    branches: ['**']
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

env:
  ARENA_PREVIEW_NO_BOOTSTRAP: "1"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Repo Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prep Runner
        uses: ./.github/actions/prepare
        with:
          pip-cache-key: ci

      - name: Install Maintenance Dependencies
        id: dependencies
        run: uv pip install --system -r requirements.txt

      - name: Read Playwright Version
        id: playwright_version
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: printf 'version=%s\n' "$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Restore Browser Download
        id: browser_cache
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright_version.outputs.version }}

      - name: Install Browser
        id: browser
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m playwright install --with-deps chromium

      - name: Describe Runner
        run: |
          printf 'CI_ENVIRONMENT=%s\n' "${RUNNER_OS}:${ImageOS}:${ImageVersion}:$(python --version):$(node --version):$(ruff --version)" >> "$GITHUB_ENV"

      - name: Restore Pass Ledger
        uses: actions/cache/restore@v4
        with:
          path: .cache/ci-ledger.json
          key: ci-ledger-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ci-ledger-${{ runner.os }}-${{ github.ref_name }}-
            ci-ledger-${{ runner.os }}-main-

      - name: Select Uncached Gates
        id: collect
        run: python maintenance/workflows/changed_paths.py --step collect

      - name: Install Build Dependencies
        id: npm
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.collect.outputs.npm_needed == 'true' }}
        run: npm ci

      - name: Check PR Contract
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          VERSION_BASE: refs/remotes/origin/${{ github.event.repository.default_branch }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: |
          set -eu
          printf '%s\n' "$PR_BODY" > "$PR_BODY_FILE"
          python maintenance/pr/gate_pr.py --range "$PR_BASE..$PR_HEAD" --version-base "$VERSION_BASE" --pr-title "$PR_TITLE" --body-file "$PR_BODY_FILE"

      - name: Select PR Plugin Validation
        id: plugin_changes
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python maintenance/workflows/changed_paths.py --step artifacts

      - name: Validate PR Plugins
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.plugin_changes.outputs.package == 'true' }}
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          VERSION_BASE: refs/remotes/origin/${{ github.event.repository.default_branch }}
        run: |
          set -eu
          python maintenance/workflows/check_artifacts.py
          python maintenance/gpt_plugins/gate_gpt_plugins.py --self-check
          git show "$VERSION_BASE:gpt-plugins/plugin.json" > "$RUNNER_TEMP/base-plugin.json"
          changed="$(git diff --name-only "$PR_BASE" HEAD -- gpt-plugins/plugin.json gpt-plugins/skills skills/nemoizer/SKILL.md skills/nemoizer/references skills/nemoizer/scripts)"
          if [ -n "$changed" ]; then
            python maintenance/gpt_plugins/gate_gpt_plugins.py --base-manifest "$RUNNER_TEMP/base-plugin.json" --package-dir "$RUNNER_TEMP/gpt-plugin-assets"
          else
            python maintenance/gpt_plugins/gate_gpt_plugins.py --package-dir "$RUNNER_TEMP/gpt-plugin-assets"
          fi

      - name: Check Module Versions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_BASE: refs/remotes/origin/${{ github.event.repository.default_branch }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then BASE="$VERSION_BASE"; else BASE="$PUSH_BEFORE"; fi
          python maintenance/pr/gate_pr.py --version-bumps "$BASE..$HEAD_SHA"

      - name: Update and Validate Repo
        id: repo_check
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.npm.outcome == 'success' && steps.collect.outputs.run_repo_check == 'true' }}
        run: python maintenance/check.py --update

      - name: Record Repo Check
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        env:
          CI_SURFACE: repo_check
          CI_DIGEST: ${{ steps.collect.outputs.digest_repo_check }}
          CI_RESULT: ${{ steps.repo_check.outcome }}
        run: python maintenance/workflows/changed_paths.py --step record

      - name: Lint and Format-Check Python
        id: ruff
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.collect.outputs.run_ruff == 'true' }}
        run: |
          ruff check .
          ruff format --diff .

      - name: Record Python Lint
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        env:
          CI_SURFACE: ruff
          CI_DIGEST: ${{ steps.collect.outputs.digest_ruff }}
          CI_RESULT: ${{ steps.ruff.outcome }}
        run: python maintenance/workflows/changed_paths.py --step record

      - name: Lint Markdown
        id: markdownlint
        if: ${{ !cancelled() && steps.npm.outcome == 'success' && steps.collect.outputs.run_markdownlint == 'true' }}
        run: npx --no-install markdownlint-cli2

      - name: Record Markdown Lint
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        env:
          CI_SURFACE: markdownlint
          CI_DIGEST: ${{ steps.collect.outputs.digest_markdownlint }}
          CI_RESULT: ${{ steps.markdownlint.outcome }}
        run: python maintenance/workflows/changed_paths.py --step record

      - name: Check Workflow Set
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python maintenance/workflows/gate_workflows.py

      - name: Run Uncached Module Tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.npm.outcome == 'success' && steps.collect.outcome == 'success' && steps.browser.outcome != 'failure' && steps.collect.outputs.test_surfaces != '' }}
        env:
          CI_TEST_SURFACES: ${{ steps.collect.outputs.test_surfaces }}
          CI_DIGESTS: ${{ steps.collect.outputs.digests }}
          CI_REQUIRE_BROWSER: "1"
        run: python maintenance/workflows/changed_paths.py --step test

      - name: Save Browser Download
        if: ${{ !cancelled() && steps.browser.outcome == 'success' && steps.browser_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright_version.outputs.version }}

      - name: Save Pass Ledger
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/ci-ledger.json
          key: ci-ledger-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
