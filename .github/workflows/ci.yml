name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
    paths-ignore:
      - '.github/workflows/distribute.yml'
      - '.gitignore'
      - 'apply.bat'
      - 'automations/**'
      - 'CHANGELOG.md'
      - 'maintenance/README.md'

permissions:
  contents: read

# The suite spawns preview.py directly, so the self-install stays out of the tests.
env:
  ARENA_PREVIEW_NO_BOOTSTRAP: "1"

concurrency:
  group: CI-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Prepare The Runner
        uses: ./.github/actions/prepare
        with:
          pip-cache-key: ci

      - name: Install Maintenance Dependencies
        run: |
          VERSION=$(sed -n 's/^required-version = "\(.*\)"$/\1/p' ruff.toml)
          python -m pip install markdown-it-py python-minifier==3.3.0 "pyyaml==6.0.3" "ruff==$VERSION"

      - name: Install Build Dependencies And Check Generated Copies
        run: |
          npm ci
          python maintenance/minify.py

      - name: Update And Validate Repository
        run: python maintenance/check.py --update

      - name: Lint And Format-Check Python
        run: |
          ruff check .
          ruff format --diff .

      - name: Check Budget Generator And Shipped Script Syntax
        run: |
          python maintenance/check_measurements.py
          node --check skills/arena-skill/assets/app.js

      # The AGENTS.md clause on Simplified Technical English: text you add or change in docs/ and the
      # The covered list lives in maintenance/check.py (STE_DOCS), shared with the local gate.
      - name: Lint The Covered Documentation
        run: python maintenance/check.py --ste

      - name: Compile Maintenance Script
        run: python -m compileall maintenance/check.py

      - name: Check The Rules Gist Publisher
        run: python3 maintenance/check_publish_clankers_rules.py

      - name: Check The Workflow Set
        run: python maintenance/check_workflows.py

      - name: Check Userscript Bundles
        run: |
          node userscripts/arena.user.js
          node userscripts/chatgpt.user.js

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Prepare The Runner
        uses: ./.github/actions/prepare
        with:
          pip-cache-key: tests

      - name: Install Test Dependencies
        run: python -m pip install markdown-it-py python-minifier==3.3.0 "pyyaml==6.0.3" pytest==9.1.1 pytest-xdist==3.6.1

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Python Test Suite
        run: python -m pytest -q -n auto

      - name: Test Commit Message Hook
        run: python maintenance/test_commit_msg.py

      - name: Run Node Userscript Tests
        run: node --test maintenance/userscripts.checks.cjs maintenance/userscripts.test.cjs

  preview-tests:
    name: Preview Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Preview Changes
        id: preview
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base="$PUSH_BEFORE"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Base commit is missing. Run the preview tests."
            exit 0
          fi
          files=$(git diff --name-only "$base" HEAD -- \
            skills/refs/arena-skill \
            skills/arena-skill \
            .agents/skills/arena-skill \
            maintenance/minify.py \
            maintenance/check_minify.py \
            github/workflows \
            pytest.ini \
            package.json \
            package-lock.json \
            .github/workflows/ci.yml)
          if [ -n "$files" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "Preview paths changed:" "$files"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No preview paths changed. Skip the preview tests."
          fi

      - name: Prepare The Runner
        if: steps.preview.outputs.run == 'true'
        uses: ./.github/actions/prepare
        with:
          pip-cache-key: preview

      - name: Install Preview Dependencies
        if: steps.preview.outputs.run == 'true'
        run: |
          python -m pip install markdown-it-py python-minifier==3.3.0 pytest==9.1.1
          npm ci

      - name: Run Preview Checks
        if: steps.preview.outputs.run == 'true'
        run: |
          python maintenance/check_minify.py
          node --test --test-reporter=dot --test-concurrency=4 skills/refs/arena-skill/scripts/client.test.cjs
