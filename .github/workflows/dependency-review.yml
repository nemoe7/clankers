name: Dependency Review

on:
  pull_request:
    branches: ['**']
    # Cover dependency manifests and action references, including nested projects.
    paths:
      - '**/requirements*.txt'
      - '**/pyproject.toml'
      - '**/setup.py'
      - '**/setup.cfg'
      - '**/Pipfile*'
      - '**/poetry.lock'
      - '**/uv.lock'
      - '**/package*.json'
      - '**/yarn.lock'
      - '**/pnpm-lock.yaml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/go.mod'
      - '**/go.sum'
      - '**/Gemfile*'
      - '**/pom.xml'
      - '**/gradle*'
      - '**/Dockerfile*'
      - '**/composer.json'
      - '**/composer.lock'
      - '**/*.csproj'
      - '**/*.fsproj'
      - '**/*.vbproj'
      - '**/packages.config'
      - '**/packages.lock.json'
      - '**/mix.exs'
      - '**/mix.lock'
      - '**/pubspec.yaml'
      - '**/pubspec.lock'
      - '**/Podfile*'
      - '**/Package.swift'
      - '**/Package.resolved'
      - '**/environment*.yml'
      - '**/environment*.yaml'
      - '.github/**'

permissions:
  contents: read

concurrency:
  group: Dependency-Review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The summary comment on a failing review needs the PR scope.
      pull-requests: write
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Review Dependency Changes
        uses: actions/dependency-review-action@v5
        with:
          # Repo threshold: high and critical advisories fail the review. The
          # dependency graph covers package-lock.json and the workflow action pins.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
