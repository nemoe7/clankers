name: Validate

on:
  pull_request:
    branches: ['**']
    paths-ignore:
      - '.github/workflows/distribute.yml'
      - '.gitignore'
      - 'apply.bat'
      - 'automations/**'
      - 'CHANGELOG.md'
      - 'maintenance/README.md'

permissions:
  contents: write

concurrency:
  group: Validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-validate-budget:
    name: Lint, Validate, And Budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          # Keep minifier output stable across interpreter releases.
          python-version: "3.11"

      - name: Cache Pip Downloads
        uses: actions/cache@v6
        with:
          # There is no requirements file: the pins live in this workflow and in ruff.toml, so the
          # workflow itself is the honest cache key and any dependency change busts it.
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/validate.yml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Maintenance Dependencies
        run: |
          VERSION=$(sed -n 's/^required-version = "\(.*\)"$/\1/p' ruff.toml)
          python -m pip install tiktoken markdown-it-py python-minifier==3.3.0 "ruff==$VERSION"

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Build Dependencies And Check Generated Copies
        run: |
          npm ci
          python maintenance/minify.py

      - name: Update And Validate Repository
        run: python maintenance/check.py --update

      - name: Lint And Format-Check Python
        run: |
          ruff check .
          ruff format --diff .

      - name: Check Budget Generator And Shipped Script Syntax
        run: |
          python maintenance/check_measurements.py
          node --check skills/arena-preview-steering/assets/app.js

      # The AGENTS.md clause on Simplified Technical English: text you add or change in docs/ and the
      # The covered list lives in maintenance/check.py (STE_DOCS), shared with the local gate.
      - name: Lint The Covered Documentation
        run: python maintenance/check.py --ste

      - name: Compile Maintenance Script
        run: python -m compileall maintenance/check.py

      - name: Check The Rules Gist Publisher
        run: python3 maintenance/check_publish_clankers_rules.py

      - name: Check Userscript Bundles
        run: |
          node userscripts/arena.user.js
          node userscripts/chatgpt.user.js
          node --test maintenance/userscripts.checks.cjs maintenance/userscripts.test.cjs

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24

  preview-tests:
    name: Preview Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Preview Changes
        id: preview
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base="$PUSH_BEFORE"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Base commit is missing. Run the preview tests."
            exit 0
          fi
          files=$(git diff --name-only "$base" HEAD -- \
            skills/refs/arena-preview-steering \
            skills/arena-preview-steering \
            .agents/skills/arena-preview-steering \
            maintenance/minify.py \
            maintenance/check_minify.py \
            github/workflows \
            pytest.ini \
            package.json \
            package-lock.json \
            .github/workflows/validate.yml)
          if [ -n "$files" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "Preview paths changed:" "$files"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No preview paths changed. Skip the preview tests."
          fi

      - name: Set Up Python
        if: steps.preview.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set Up Node
        if: steps.preview.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Test Dependencies
        if: steps.preview.outputs.run == 'true'
        run: |
          python -m pip install markdown-it-py python-minifier==3.3.0 pytest==9.1.1 pytest-xdist==3.6.1
          npm ci

      - name: Run Preview Tests
        if: steps.preview.outputs.run == 'true'
        run: |
          python -m pytest -q -n auto
          python maintenance/check_minify.py
          node --test --test-reporter=dot --test-concurrency=4 skills/refs/arena-preview-steering/scripts/client.test.cjs
