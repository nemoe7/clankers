name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install maintenance dependencies
        run: python -m pip install tiktoken markdown-it-py

      - name: Update and validate repository
        run: python maintenance/check.py --update

      - name: Commit README maintenance
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- README.md; then
            echo "README measurements already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(maintenance): update README measurements"
          git push

      - name: Compile maintenance script
        run: python -m compileall maintenance/check.py

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "rules/{AGENTS,ARENA,CLINE}.md"
