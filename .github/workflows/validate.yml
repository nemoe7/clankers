name: Validate

on:
  push:
    branches: ['**']
    paths-ignore:
      - '.github/workflows/distribute-arena.yml'
      - '.gitignore'
      - 'apply.bat'
      - 'automations/**'
      - 'CHANGELOG.md'
      - 'maintenance/README.md'
  pull_request:
    branches: ['**']
    paths-ignore:
      - '.github/workflows/distribute-arena.yml'
      - '.gitignore'
      - 'apply.bat'
      - 'automations/**'
      - 'CHANGELOG.md'
      - 'maintenance/README.md'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install maintenance dependencies
        run: python -m pip install tiktoken markdown-it-py

      - name: Update and validate repository
        run: python maintenance/check.py --update

      - name: Commit README maintenance
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- README.md; then
            echo "README measurements already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(maintenance): update README measurements"
          git push

      - name: Install Ruff
        run: |
          VERSION=$(sed -n 's/^required-version = "\(.*\)"$/\1/p' ruff.toml)
          python -m pip install "ruff==$VERSION"

      - name: Lint and format-check Python
        run: |
          ruff check .
          ruff format --diff .

      - name: Compile maintenance script
        run: python -m compileall maintenance/check.py

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
