name: Validate

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/distribute-arena.yml'
      - '.gitignore'
      - 'apply.bat'
      - 'automations/**'
      - 'CHANGELOG.md'
      - 'maintenance/README.md'
  pull_request:
    branches: ['**']
    paths-ignore:
      - '.github/workflows/distribute-arena.yml'
      - '.gitignore'
      - 'apply.bat'
      - 'automations/**'
      - 'CHANGELOG.md'
      - 'maintenance/README.md'

permissions:
  contents: write

concurrency:
  group: Validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-validate-budget:
    name: Lint, Validate, And Budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          # Keep minifier output stable across interpreter releases.
          python-version: "3.11"

      - name: Cache Pip Downloads
        uses: actions/cache@v4
        with:
          # There is no requirements file: the pins live in this workflow and in ruff.toml, so the
          # workflow itself is the honest cache key and any dependency change busts it.
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/validate.yml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Maintenance Dependencies
        run: |
          VERSION=$(sed -n 's/^required-version = "\(.*\)"$/\1/p' ruff.toml)
          python -m pip install tiktoken markdown-it-py python-minifier==3.3.0 "ruff==$VERSION"

      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Build Dependencies And Check Generated Copies
        run: |
          npm ci
          python maintenance/minify.py

      - name: Update And Validate Repository
        run: python maintenance/check.py --update

      - name: Commit README Maintenance
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- README.md; then
            echo "README measurements already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(maintenance): update README measurements"
          git push

      - name: Lint And Format-Check Python
        run: |
          ruff check .
          ruff format --diff .

      - name: Check Budget Generator And Shipped Script Syntax
        run: |
          python maintenance/check_measurements.py
          node --check skills/arena-preview-steering/assets/app.js

      # The AGENTS.md clause on Simplified Technical English: text you add or change in docs/ and the
      # README files must pass the vendored linter, and each covered file joins this step as it is
      # cleaned. Add a path only when the linter reports 0 violations for it.
      - name: Lint The Covered Documentation
        run: |
          python .agents/skills/asd-ste100/scripts/ste-lint.py \
            maintenance/README.md \
            skills/README.md \
            README.md \
            docs/archive/budget-exceptions.md \
            workflows/README.md \
            .agents/skills/README.md \
            docs/archive/arena-quirks.md \
            rules/README.md \
            rules/refs/README.md \
            gpt-plugins/README.md

      - name: Compile Maintenance Script
        run: python -m compileall maintenance/check.py

      - name: Check The Gist Publishers
        run: |
          python3 maintenance/check_publish_clankers_rules.py
          python3 maintenance/check_publish_userscripts.py

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20

  preview-tests:
    name: Preview Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Preview Changes
        id: preview
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base="$PUSH_BEFORE"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Base commit is missing. Run the preview tests."
            exit 0
          fi
          files=$(git diff --name-only "$base" HEAD -- \
            skills/refs/arena-preview-steering \
            skills/arena-preview-steering \
            .agents/skills/arena-preview-steering \
            maintenance/minify.py \
            maintenance/check_minify.py \
            package.json \
            package-lock.json \
            .github/workflows/validate.yml)
          if [ -n "$files" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "Preview paths changed:" "$files"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No preview paths changed. Skip the preview tests."
          fi

      - name: Set Up Python
        if: steps.preview.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set Up Node
        if: steps.preview.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Test Dependencies
        if: steps.preview.outputs.run == 'true'
        run: |
          python -m pip install markdown-it-py python-minifier==3.3.0 pytest==9.1.1
          npm ci

      - name: Run Preview Tests
        if: steps.preview.outputs.run == 'true'
        run: |
          python -m pytest skills/refs/arena-preview-steering/scripts/check_preview.py -q
          python maintenance/check_minify.py
          node --test skills/refs/arena-preview-steering/scripts/check_client.cjs
