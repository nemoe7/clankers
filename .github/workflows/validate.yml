name: Validate

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/distribute-arena.yml'
      - '.gitignore'
      - 'apply.bat'
      - 'automations/**'
      - 'CHANGELOG.md'
      - 'maintenance/README.md'
  pull_request:
    branches: ['**']
    paths-ignore:
      - '.github/workflows/distribute-arena.yml'
      - '.gitignore'
      - 'apply.bat'
      - 'automations/**'
      - 'CHANGELOG.md'
      - 'maintenance/README.md'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Keep minifier output stable across interpreter releases.
          python-version: "3.11"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          # There is no requirements file: the pins live in this workflow and in ruff.toml, so the
          # workflow itself is the honest cache key and any dependency change busts it.
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/validate.yml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install maintenance dependencies
        run: python -m pip install tiktoken markdown-it-py python-minifier==3.3.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install build dependencies and check generated copies
        run: |
          npm ci
          python maintenance/minify.py

      - name: Update and validate repository
        run: python maintenance/check.py --update

      - name: Commit README maintenance
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- README.md; then
            echo "README measurements already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(maintenance): update README measurements"
          git push

      - name: Install Ruff
        run: |
          VERSION=$(sed -n 's/^required-version = "\(.*\)"$/\1/p' ruff.toml)
          python -m pip install "ruff==$VERSION"

      - name: Lint and format-check Python
        run: |
          ruff check .
          ruff format --diff .

      - name: Check shared preview runtime and client
        run: |
          python maintenance/check_measurements.py
          # Exact page strings use readable assets; check_minify also exercises generated Python
          # with those assets and page assembly with the shipped assets.
          python skills/refs/arena-preview-steering/scripts/check_preview.py
          python maintenance/check_minify.py
          node --check skills/arena-preview-steering/assets/app.js
          node skills/arena-preview-steering/scripts/check_client.cjs

      # The AGENTS.md clause on Simplified Technical English: text you add or change in docs/ and the
      # README files must pass the vendored linter, and each covered file joins this step as it is
      # cleaned. Add a path only when the linter reports 0 violations for it.
      - name: Lint the covered documentation
        run: |
          python .agents/skills/asd-ste100/scripts/ste-lint.py \
            maintenance/README.md \
            skills/README.md \
            README.md \
            docs/archive/budget-exceptions.md \
            workflows/README.md \
            .agents/skills/README.md \
            docs/archive/arena-quirks.md \
            rules/README.md \
            rules/refs/README.md

      - name: Compile maintenance script
        run: python -m compileall maintenance/check.py

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
