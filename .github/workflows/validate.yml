name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install maintenance dependencies
        run: python -m pip install tiktoken markdown-it-py

      - name: Validate repository
        run: python maintenance/check.py

      - name: Compile maintenance script
        run: python -m compileall maintenance/check.py

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "rules/{AGENTS,ARENA,CLINE}.md"
