name: Prepare Runner
description: Set up Python and Node with the shared uv cache.

inputs:
  pip-cache-key:
    description: Suffix that keeps each job's uv cache apart.
    default: ci

runs:
  using: composite
  steps:
    - name: Set Up Python
      uses: actions/setup-python@v7
      with:
        # Keep minifier output stable across interpreter releases.
        python-version: "3.11"

    - name: Set Up uv
      uses: astral-sh/setup-uv@v10.3.1
      with:
        enable-cache: true
        cache-suffix: ${{ inputs.pip-cache-key }}
        cache-dependency-glob: requirements.txt

    - name: Set Up Node
      uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: npm
