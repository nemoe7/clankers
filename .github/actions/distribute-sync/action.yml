# Copies the files a session loads at runtime into one target repository, then proves the copy after the push.
# Each distribute job names its own repository list, so one list never reaches the other jobs' targets.
name: Distribute Sync
description: Copy the rules, the skills and the release workflow into each target repository and verify the copy after the push.
inputs:
  repos:
    description: Space-separated owner/repo list this job walks
    required: false
    default: ""
  repos-fallback:
    description: The list this job walks when the dispatcher passes none
    required: true
  rule-src:
    description: Rule file to copy, relative to the source repository; empty copies none
    required: false
    default: ""
  rule-dest:
    description: Path the rule file takes in the target repository
    required: false
    default: ""
  skills:
    description: Skill directory names under the skill root to copy; empty copies none
    required: false
    default: ""
  skill-root:
    description: Directory that holds the skills in the source repository
    required: false
    default: skills
  skill-dest-root:
    description: Directory that holds the skills in the target repository
    required: false
    default: .agents/skills
  legacy:
    description: Retired skill directory names to remove from the target
    required: false
    default: ""
  files:
    description: File names under the source workflow root to copy; empty copies none
    required: false
    default: ""
  src-root:
    description: Directory that holds the copied workflow files in the source repository
    required: false
    default: github/workflows
  dest-root:
    description: Directory the copied workflow files take in the target repository
    required: false
    default: .github/workflows
runs:
  using: composite
  steps:
    - name: Copy And Verify Each Target
      shell: bash
      env:
        REPOS: ${{ inputs.repos }}
        REPOS_FALLBACK: ${{ inputs.repos-fallback }}
        RULE_SRC: ${{ inputs.rule-src }}
        RULE_DEST: ${{ inputs.rule-dest }}
        SKILLS: ${{ inputs.skills }}
        SKILL_ROOT: ${{ inputs.skill-root }}
        SKILL_DEST_ROOT: ${{ inputs.skill-dest-root }}
        LEGACY: ${{ inputs.legacy }}
        FILES: ${{ inputs.files }}
        SRC_ROOT: ${{ inputs.src-root }}
        DEST_ROOT: ${{ inputs.dest-root }}
      run: |
        set -euo pipefail
        REPOS="${REPOS:-$REPOS_FALLBACK}"
        [ -n "${REPOS// /}" ] || { echo "::error::no target repos configured"; exit 1; }
        if [ -n "$RULE_SRC" ]; then
          [ -f "$GITHUB_WORKSPACE/$RULE_SRC" ] || { echo "::error::$RULE_SRC missing"; exit 1; }
          [ -n "$RULE_DEST" ] || { echo "::error::rule-dest is required with rule-src"; exit 1; }
        fi
        for f in $FILES; do
          [ -f "$GITHUB_WORKSPACE/$SRC_ROOT/$f" ] || { echo "::error::$SRC_ROOT/$f missing"; exit 1; }
        done

        # Tracked files, minus the pages that stay here and the owner-run packages under
        # arena-egress-proxy/ and arena-preview-proxy/, which stay beside the published images.
        skill_files() {
          local out
          out=$(git -C "$GITHUB_WORKSPACE" ls-files "$SKILL_ROOT/$1" | sed "s|^$SKILL_ROOT/$1/||" \
            | grep -vFx -e README.md -e INSTALL.md | grep -vE '^(arena-egress-proxy|arena-preview-proxy)/' || true)
          printf '%s\n' "$out"
        }
        for skill in $SKILLS; do
          if [ -z "$(skill_files "$skill")" ]; then
            echo "::error::no tracked files for $skill"
            exit 1
          fi
        done

        failed=""
        # shellcheck disable=SC2016  # The helper expands the token when git calls it.
        git config --global credential.helper '!f() { echo username=x-access-token; echo "password=$CLANKERS_DIST_PAT"; }; f'
        for repo in $REPOS; do
          (
            set -e
            work=$(mktemp -d)
            trap 'rm -rf "$work"' EXIT
            git clone --quiet --depth 1 "https://github.com/$repo.git" "$work"
            if [ -n "$RULE_SRC" ]; then
              mkdir -p "$work/$(dirname "$RULE_DEST")"
              cp "$GITHUB_WORKSPACE/$RULE_SRC" "$work/$RULE_DEST"
            fi
            for legacy in $LEGACY; do
              rm -rf "$work/$SKILL_DEST_ROOT/$legacy"
            done
            for skill in $SKILLS; do
              files=$(skill_files "$skill")
              [ -n "$files" ] || continue
              # The whole directory goes, so a page that this repository keeps leaves the target repo on the same run.
              rm -rf "$work/$SKILL_DEST_ROOT/$skill"
              for f in $files; do
                mkdir -p "$work/$SKILL_DEST_ROOT/$skill/$(dirname "$f")"
                cp "$GITHUB_WORKSPACE/$SKILL_ROOT/$skill/$f" "$work/$SKILL_DEST_ROOT/$skill/$f"
              done
            done
            for f in $FILES; do
              mkdir -p "$work/$DEST_ROOT/$(dirname "$f")"
              cp "$GITHUB_WORKSPACE/$SRC_ROOT/$f" "$work/$DEST_ROOT/$f"
            done
            cd "$work"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit --quiet -m "chore: clankers sync"
              git push --quiet -u origin HEAD
            fi
            if [ -n "$RULE_SRC" ]; then
              git show "HEAD:$RULE_DEST" | cmp -s - "$GITHUB_WORKSPACE/$RULE_SRC" || {
                echo "::error::$repo: $RULE_DEST differs after sync"; exit 1;
              }
            fi
            for legacy in $LEGACY; do
              [ -z "$(git ls-tree -r --name-only HEAD -- "$SKILL_DEST_ROOT/$legacy")" ] || {
                echo "::error::$repo: retired skill $legacy remains"; exit 1;
              }
            done
            for skill in $SKILLS; do
              files=$(skill_files "$skill")
              [ -n "$files" ] || continue
              have=$(git ls-tree -r --name-only "HEAD:$SKILL_DEST_ROOT/$skill" | sort)
              # shellcheck disable=SC2086  # The word split lists one path per line.
              want=$(printf '%s\n' $files | sort)
              [ "$have" = "$want" ] || { echo "::error::$repo: $skill file-list mismatch"; exit 1; }
              for f in $files; do
                git show "HEAD:$SKILL_DEST_ROOT/$skill/$f" | cmp -s - "$GITHUB_WORKSPACE/$SKILL_ROOT/$skill/$f" || {
                  echo "::error::$repo: $skill/$f differs"; exit 1;
                }
              done
            done
            for f in $FILES; do
              git show "HEAD:$DEST_ROOT/$f" | cmp -s - "$GITHUB_WORKSPACE/$SRC_ROOT/$f" || {
                echo "::error::$repo: $f differs after sync"; exit 1;
              }
            done
            echo "$repo: verified"
          ) || failed="$failed $repo"
        done
        [ -z "$failed" ] || { echo "::error::sync failed for:$failed"; exit 1; }
