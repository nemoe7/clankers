[tool.pytest.ini_options]
# One root `pytest` runs every Python test. Product `gate_*.py` files stay gates, not tests.
# Every run splits across the workers, local and CI both, so the config is the single source.
addopts = "-n auto"
testpaths = [
  "tests",
]
python_files = ["test_*.py"]
pythonpath = [
  "github/workflows",
  "maintenance",
  "maintenance/gpt_plugins",
  "maintenance/minify",
  "maintenance/pr",
  "maintenance/publish",
  "maintenance/workflows",
  "skills/nemoizer/scripts",
  "skills/nuu/scripts",
  "skills/refs/arena-skill/scripts",
]

[tool.ruff]
required-version = "0.17.3"
indent-width = 2
# The project does not own vendored third-party code. Do not reformat or lint it.
# Check generated Python through minify.py. Lint and format its readable refs.
extend-exclude = [
  ".agents/skills",
  "skills/arena-skill/scripts/preview.py",
  "skills/arena-skill/scripts/survey.py",
]

[tool.ruff.lint]
ignore = ["BLE001", "S110"]
# E501 is not in ruff's default rule set, and the formatter's own `line-length` must stay where `ruff format` put it.
# The 120-character limit rides the pycodestyle setting alone, so lint and format keep their separate widths.
extend-select = ["E501"]
extend-safe-fixes = ["C408", "PERF102", "RUF059"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120
