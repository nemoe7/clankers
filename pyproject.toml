[tool.pytest.ini_options]
# One root `pytest` runs every Python test. Product `gate_*.py` files stay gates, not tests.
# Every run splits across the workers, local, and CI both, so the config is the single source.
addopts = "-n auto"
testpaths = [
  "tests",
]
python_files = ["test_*.py"]
pythonpath = [
  "github/workflows",
  "maintenance",
  "maintenance/gpt_plugins",
  "maintenance/pr",
  "maintenance/publish",
  "maintenance/workflows",
  "skills/arena-steering/scripts",
  "skills/nemoizer/scripts",
  "skills/nuu/scripts",
]

[tool.ruff]
required-version = "0.17.3"
indent-width = 2
# The project does not own vendored third-party code. Do not reformat or lint it.
# Archived v1 code stays readable and outside active lint checks.
extend-exclude = [
  ".agents/skills",
  "docs/archive/arena-skill",
]

[tool.ruff.lint]
ignore = ["BLE001", "S110"]
# E501 is not in ruff's default rule set, and the formatter's own `line-length` must stay where `ruff format` put it.
# The 120-character limit rides the pycodestyle setting alone, so lint and format keep their separate widths.
extend-select = ["E501"]
extend-safe-fixes = ["C408", "PERF102", "RUF059"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.nemoizer]
extend-exclude = [
  "skills/**/*.md",
  "!skills/**/README.md",
  "rules/**",
  "**/*.min.js",
  "skills/nuu/data/vendor",
  "skills/refs/nuu/data/vendor",
  "docs/archive/CHANGELOG.md",
  "docs/archive/arena-skill/**",
  "tests/skills/arena-preview-proxy/**",
  "automations/**/*.md",
  "!automations/**/README.md",
  "system-prompts/**/*.md",
  "!system-prompts/**/README.md",
  "gpt-plugins/**/*.md",
  "!gpt-plugins/**/README.md",
  "userscripts/arena-prompt-fill.txt",
  "userscripts/refs/arena-prompt-fill.txt",
]

[[tool.nemoizer.files]]
paths = ["docs/CHANGELOG.md", "docs/**/CHANGELOG.md"]
list-sentence-cap = 3
