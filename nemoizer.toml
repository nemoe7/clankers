extend-exclude = [
  "skills/**/*.md",
  "!skills/**/README.md",
  "rules/**",
  "!rules/README.md",
  "!rules/refs/README.md",
  "!.agents/skills/README.md",
  "**/*.min.js",
  "skills/nuu/data/vendor",
  "skills/refs/nuu/data/vendor",
  "docs/archive/CHANGELOG.md",
  "docs/archive/arena-skill/**",
  "tests/skills/arena-preview-proxy/**",
  "automations/**/*.md",
  "!automations/**/README.md",
  "system-prompts/**/*.md",
  "!system-prompts/**/README.md",
  "gpt-plugins/**/*.md",
  "!gpt-plugins/**/README.md",
  "userscripts/arena-prompt-fill.txt",
  "userscripts/refs/arena-prompt-fill.txt",
