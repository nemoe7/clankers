  "!skills/**/README.md",
  "rules/**",
  "!rules/README.md",
  "!rules/refs/README.md",
  "!.agents/skills/README.md",
  "tests/skills/arena-preview-proxy/**",
  "automations/**/*.md",
  "!automations/**/README.md",
  "system-prompts/**/*.md",
  "!system-prompts/**/README.md",
  "gpt-plugins/**/*.md",
  "userscripts/arena-prompt-fill.txt",
  "userscripts/refs/arena-prompt-fill.txt",
  "*.min.*",
  "archive",
  "archives",
  "vendor",
  "vendors",
  "vendored",
  "third_party",
  "third-party",
  "*.zip",
  "*.tar",
  "*.gz",
  "*.tgz",
  "*.bz2",
  "*.xz",
  "*.7z",
  "*.rar",
