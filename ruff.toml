required-version = "0.16.6"
indent-width = 2

# Vendored third-party code is copied verbatim, so it is not ours to reformat or lint.
# Generated Python is checked by minify.py; lint and format its readable refs instead.
extend-exclude = [
  ".agents/skills",
  "skills/arena-skill/scripts/preview.py",
]

[lint]
ignore = ["BLE001", "S110"]
# E501 is not in ruff's default rule set, and the formatter's own `line-length` must stay where
# `ruff format` put it. The 120-character limit rides the pycodestyle setting alone, so lint and
# format keep their separate widths (owner note 61d53d5).
extend-select = ["E501"]
extend-safe-fixes = ["C408", "PERF102", "RUF059"]

[lint.pycodestyle]
max-line-length = 120
