# Runs the published arena-egress-proxy image behind a Tailscale sidecar. Set TS_AUTHKEY and GITHUB_TOKEN in the environment, or in a .env file.
# Every start makes a new agent key and prints it once in the log. The sidecar applies tailscale-serve.json and publishes the funnel URL https://arena-proxy.<tailnet>.ts.net to the public internet on port 443.
services:
  proxy:
    image: ghcr.io/nemoe7/arena-egress-proxy:latest
    container_name: arena-proxy
    restart: unless-stopped
    # The Tailscale sidecar owns the network namespace, so the proxy takes no ports.
    network_mode: service:tailscale
    environment:
      # A fine-grained, read-only token for the GitHub routes. Leave it out to skip them.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Set a master key to turn on the /v1/key and /v1/board routes. Leave it out to keep them off.
      ARENA_PROXY_MASTER_KEY: ${ARENA_PROXY_MASTER_KEY:-}
      # Suppress unchanged board poll lines when set to 1.
      ARENA_PROXY_QUIET_POLLS: ${ARENA_PROXY_QUIET_POLLS:-0}
    volumes:
      - arena-proxy-state:/state
    depends_on:
      - tailscale

  tailscale:
    image: tailscale/tailscale:latest
    container_name: arena-proxy-tailscale
    restart: unless-stopped
    hostname: arena-proxy
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/tailscale-serve.json
      TS_USERSPACE: "false"
      # A tagged auth key already reaches the node. Do not request another key.
      # Add flags through TS_EXTRA_ARGS when needed, for example --accept-routes.
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/tailscale-serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module

volumes:
  arena-proxy-state:
  tailscale-state:
